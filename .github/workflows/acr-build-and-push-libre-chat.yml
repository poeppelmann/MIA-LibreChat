name: Build and Push MIA - LibreChat Container to ACR

on:
  push:
    branches: ["release"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: acr-release
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: mia

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install registry dependency
        run: npm ci --prefix scripts/mia --ignore-scripts

      - name: Validate registry and resolve versions
        id: version
        run: |
          set -o pipefail
          node scripts/mia/registry.mjs validate
          node scripts/mia/registry.mjs generate --check
          node scripts/mia/registry.mjs release | tee -a "$GITHUB_OUTPUT"

      - name: Refuse to reuse an existing git tag
        run: node scripts/mia/registry.mjs tagfree

      - name: Compute build metadata
        id: build
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR sanity
        run: |
          az account show -o table
          az acr show -n "${{ vars.ACR_NAME }}" -o table

      - name: Refuse to overwrite an existing image tag
        run: |
          set +e
          OUTPUT="$(az acr repository show --name "${{ vars.ACR_NAME }}" --image "${{ env.IMAGE_NAME }}:${{ steps.version.outputs.mia }}" 2>&1)"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "Image tag ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.mia }} already exists in ACR. Bump docs/mia/VERSION."
            exit 1
          fi
          if ! printf '%s' "$OUTPUT" | grep -Eiq 'not found|could not be found|does not exist|manifest unknown|name unknown'; then
            echo "Could not tell whether the image tag exists:"
            echo "$OUTPUT"
            exit 1
          fi

      - name: Login to ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.multi
          push: true
          tags: ${{ vars.ACR_REGISTRY_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.mia }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.mia }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.build.outputs.date }}
            de.poeppelmann.mia.release=${{ steps.version.outputs.mia }}
            de.poeppelmann.mia.librechat-version=${{ steps.version.outputs.librechat }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ steps.build.outputs.date }}

      - name: Tag release commit
        run: |
          git tag "mia-${{ steps.version.outputs.mia }}" "${{ github.sha }}"
          git push origin "mia-${{ steps.version.outputs.mia }}"

      - name: Lock image tag
        run: |
          az acr repository update --name "${{ vars.ACR_NAME }}" --image "${{ env.IMAGE_NAME }}:${{ steps.version.outputs.mia }}" --write-enabled false \
            || echo "::warning::Could not lock ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.mia }}; the tag stays writable in ACR."

      - name: Summary for MIA-Config handover
        run: |
          {
            echo "## MIA ${{ steps.version.outputs.mia }} (LibreChat ${{ steps.version.outputs.librechat }})"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`${{ vars.ACR_REGISTRY_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.mia }}\` |"
            echo "| Digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| MIA release | ${{ steps.version.outputs.mia }} |"
            echo "| LibreChat base | ${{ steps.version.outputs.librechat }} |"
            echo "| Commit | ${{ github.sha }} |"
            echo
            echo "Next: scan the digest, then set it in MIA-Config (dev, test, prod). See docs/mia/UPSTREAM-UPDATE.md."
          } >> "$GITHUB_STEP_SUMMARY"
